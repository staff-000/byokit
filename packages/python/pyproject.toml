[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byokit"
version = "0.0.2"
description = "Add BYOK with a model list and one simple call. Keep your model choices fresh."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[project.scripts]
byokit = "byokit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
byokit = ["data/*.json", "data/NOTICE", "py.typed"]
