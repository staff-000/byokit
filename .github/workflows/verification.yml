name: Publish community model verification
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  record:
    if: contains(github.event.issue.body, '<!-- byokit-verification:v1 -->') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      recognized: ${{ steps.record.outputs.recognized }}
      changed: ${{ steps.record.outputs.changed }}
      ref: ${{ steps.record.outputs.ref }}
      staging: ${{ steps.record.outputs.staging }}
      operation: ${{ steps.record.outputs.operation }}
      failure: ${{ steps.record.outputs.failure }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate GitHub issue and commit report
        id: record
        run: node scripts/publish-verification.mjs
  deploy:
    needs: record
    if: needs.record.outputs.recognized == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.record.outputs.ref }}
  notify:
    needs: [record, deploy]
    if: always() && needs.record.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Confirm public feed and report result
        run: node scripts/finish-verification.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_RESULT: ${{ needs.record.result }}
          PUBLICATION_FAILURE: ${{ needs.record.outputs.failure }}
          RECORD_REF: ${{ needs.record.outputs.ref }}
          STAGING: ${{ needs.record.outputs.staging }}
          OPERATION_ID: ${{ needs.record.outputs.operation }}
