name: Deploy byokit website
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Capture source revision
        id: revision
        run: node -e 'const fs=require("node:fs"),cp=require("node:child_process");fs.appendFileSync(process.env.GITHUB_OUTPUT,"commit="+cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim()+"\n")'
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: dist/site}
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Avoid publishing an older catalog over current main
        id: current
        uses: actions/github-script@v7
        env:
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        with:
          script: |
            const head = await github.rest.repos.getCommit({...context.repo, ref: 'main'});
            return head.data.sha === process.env.BUILD_COMMIT;
      - name: Publish website
        if: steps.current.outputs.result == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
